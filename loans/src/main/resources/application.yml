server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3308/loansdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#  tận dụng file schema.sql
#  sql:
#    init:
#      mode: always
  config:
    import: " optional:configserver:http://localhost:8071"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # expose endpoint: /actuator/shutdown
  endpoint:
    shutdown:
      access: unrestricted
  # expose endpoint: /actuator/info
  info:
    env:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

# in eureka dashboard
info:
  app:
    name: "loans"
    description: "Easy Bank Loans Application"
    version: 1.0.0