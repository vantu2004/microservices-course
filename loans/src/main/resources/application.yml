server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3308/loansdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#  tận dụng file schema.sql
#  sql:
#    init:
#      mode: always
  config:
    import: " optional:configserver:http://localhost:8071"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    bus:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: "*"
  # expose endpoint: /actuator/shutdown
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  # expose endpoint: /actuator/info
  info:
    env:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  # bảo micrometer & Prometheus gom tất cả metrics của account service lại
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

# in eureka dashboard
info:
  app:
    name: "loans"
    description: "Easy Bank Loans Application"
    version: 1.0.0

# bật log cho gatewayserver để log Correlation Id
logging:
  level:
    com:
      easybytes:
        loans: DEBUG