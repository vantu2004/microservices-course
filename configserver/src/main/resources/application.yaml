spring:
  application:
    name: configserver
  profiles:
    # active: native
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/vantu2004/easybytes-config.git"
          default-label: master
          timeout: 5
          clone-on-start: true
          force-pull: true
        # native:
          # search-locations: "classpath:/config"
          # search-locations: "file:///C://Users//tulev//OneDrive//Documents//bin//config"
    bus:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8071

encrypt:
  key: "Ux4B(t,6X]shYE[9"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  # Cho phép Spring Boot tự động ghép liveness + readiness vào health, nghĩa là chỉ cần gọi /actuator/health là trả về đủ readiness và liveness
  endpoint:
    health:
      probes:
        enabled: true
  # bảo micrometer & Prometheus gom tất cả metrics của config service lại
  metrics:
    tags:
      application: ${spring.application.name}