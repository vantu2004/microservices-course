spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  # Tự động tạo route cho các microservices đã đăng ký với Eureka, là các default routes trong /actuator/gateway/routes
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              # gateway tự convert về lowercase
              lower-case-service-id: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # expose endpoint: /actuator/gateway/routes
  endpoint:
    gateway:
      access: unrestricted
  # expose endpoint: /actuator/info
  info:
    env:
      enabled: true

